name: spoti.ch aktualisieren

# Laeuft bei JEDER Aenderung auf main und laedt die Website auf mycyon.ch hoch.
# Zusaetzlich jederzeit von Hand startbar unter Actions -> Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Auf spoti.ch hochladen
    runs-on: ubuntu-latest

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Zugangsdaten vorhanden?
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          USER: ${{ secrets.FTP_USERNAME }}
          PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          fehlt=""
          [ -n "$SERVER" ] || fehlt="$fehlt FTP_SERVER"
          [ -n "$USER" ]   || fehlt="$fehlt FTP_USERNAME"
          [ -n "$PASS" ]   || fehlt="$fehlt FTP_PASSWORD"
          if [ -n "$fehlt" ]; then
            echo "::error title=Zugangsdaten fehlen::Diese Secrets sind nicht gesetzt:$fehlt — anlegen unter Settings → Secrets and variables → Actions, dann diesen Workflow erneut starten."
            exit 1
          fi
          echo "Alle drei Secrets vorhanden."

      - name: Pflichtdateien vorhanden?
        run: |
          set -e
          for f in public/index.html public/demo/index.html \
                   public/daten/produkte.js public/assets/css/style.css \
                   public/assets/js/seite.js; do
            [ -f "$f" ] || { echo "::error::Datei fehlt: $f"; exit 1; }
          done
          echo "Website vollstaendig."

      - name: Preisfreigabe pruefen
        run: |
          if grep -q '"preise_freigegeben": *false' public/daten/produkte.js; then
            echo "::warning title=Preise ausgeblendet::preise_freigegeben steht auf false. Die Seite zeigt ueberall 'Preis auf Anfrage' und einen Hinweisbalken."
          else
            echo "Preise sind freigegeben."
          fi

      - name: Per FTP hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || 21 }}
          local-dir: ./public/
          server-dir: ${{ vars.FTP_SERVER_DIR || '/' }}
          dangerous-clean-slate: false
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
            **/node_modules/**

      - name: Fertig
        run: echo "Hochgeladen. Seite pruefen unter https://www.spoti.ch"
