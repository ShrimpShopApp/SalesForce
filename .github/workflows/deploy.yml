name: spoti.ch aktualisieren

# Laedt die Website bei jeder Aenderung auf main per FTP zu cyon hoch.
# Aufgebaut wie der bewaehrte Deploy von taragona.org: FTP-Deploy-Action ohne
# protocol-Angabe (also einfaches FTP) und ein zweiter Versuch, falls der
# erste in einen Timeout laeuft.
#
# ---------------------------------------------------------------------------
# EINRICHTUNG
#
# Secrets   FTP_PASSWORD   Passwort des FTP-Kontos
# Variables FTP_USER       Standard admin@spoti.ch
#           FTP_HOST       Standard s039.cyon.net
#           FTP_ZIEL       Standard /salesforce/
#
# Zum Zielordner: Das FTP-Konto admin@spoti.ch startet in
# /home/muehlefe/public_html/taragona.org/webwork
# Der Webroot von spoti.ch liegt eine Ebene tiefer in salesforce/ —
# deshalb /salesforce/ und nicht /.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Auf spoti.ch hochladen
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Pflichtdateien vorhanden?
        run: |
          set -e
          for f in public/index.html public/demo/index.html \
                   public/daten/produkte.js public/assets/css/style.css \
                   public/assets/js/seite.js; do
            [ -f "$f" ] || { echo "::error::Datei fehlt: $f"; exit 1; }
          done
          echo "Website vollstaendig: $(find public -type f | wc -l) Dateien."
          echo "Ziel: ${{ vars.FTP_USER || 'admin@spoti.ch' }}@${{ vars.FTP_HOST || 's039.cyon.net' }} -> ${{ vars.FTP_ZIEL || '/salesforce/' }}"

      - name: Preisfreigabe pruefen
        run: |
          if grep -qE '"preise_freigegeben"[[:space:]]*:[[:space:]]*false[[:space:]]*,' public/daten/produkte.js; then
            echo "::warning title=Preise ausgeblendet::preise_freigegeben steht auf false. Die Seite zeigt ueberall 'Preis auf Anfrage' und einen Hinweisbalken."
          else
            echo "Preise sind freigegeben."
          fi

      - name: FTP Deploy
        id: upload1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.FTP_HOST || 's039.cyon.net' }}
          username: ${{ vars.FTP_USER || 'admin@spoti.ch' }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_ZIEL || '/salesforce/' }}
          local-dir: ./public/
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
            **/node_modules/**

      - name: FTP Deploy (Wiederholung bei Timeout)
        if: steps.upload1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.FTP_HOST || 's039.cyon.net' }}
          username: ${{ vars.FTP_USER || 'admin@spoti.ch' }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_ZIEL || '/salesforce/' }}
          local-dir: ./public/
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
            **/node_modules/**

      - name: Fertig
        run: echo "Hochgeladen. Seite pruefen unter https://www.spoti.ch"
