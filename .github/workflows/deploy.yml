name: Kopie auf cyon per FTP (nur manuell)

# Laedt die Website per FTP zu cyon hoch. Nur auf Zuruf, siehe unten.
# Aufgebaut wie der bewaehrte Deploy von taragona.org: FTP-Deploy-Action ohne
# protocol-Angabe (also einfaches FTP) und ein zweiter Versuch, falls der
# erste in einen Timeout laeuft.
#
# ---------------------------------------------------------------------------
# EINRICHTUNG
#
# Secrets   FTP_PASSWORD   Passwort des FTP-Kontos
# Variables FTP_USER       Standard admin@spoti.ch
#           FTP_HOST       Standard s039.cyon.net
#           FTP_ZIEL       Standard /salesforce/
#
# Zum Zielordner: Das FTP-Konto admin@spoti.ch startet in
# /home/muehlefe/public_html/taragona.org/webwork
# Der Webroot von spoti.ch liegt eine Ebene tiefer in salesforce/ —
# deshalb /salesforce/ und nicht /.
# ---------------------------------------------------------------------------

# ACHTUNG: Das ist NICHT das Deployment von spoti.ch.
# Die Domain laeuft ueber GitHub Pages, siehe static.yml. Dieser Workflow
# legt lediglich eine Kopie im cyon-Ordner ab und laeuft nur von Hand.
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Auf spoti.ch hochladen
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Bilder aus Textdateien erzeugen
        run: |
          for b in public/assets/img/*.b64; do
            ziel="${b%.b64}"
            base64 -d "$b" > "$ziel"
            echo "erzeugt: $ziel ($(wc -c < "$ziel") Bytes)"
          done

      - name: Fotos laden (Unsplash-Lizenz, siehe BILDNACHWEIS.md)
        run: |
          set -e
          B="https://images.unsplash.com/photo-"
          Z="public/assets/img"
          curl -fsSL "${B}1773806902883-8a65768c75f6?q=85&w=1568&h=704&fit=crop&fm=webp" -o "$Z/foto-hero-see.webp"
          curl -fsSL "${B}1684253193395-bb87ad32d4be?q=85&w=938&h=704&fit=crop&fm=webp"  -o "$Z/foto-crevetten-grill.webp"
          curl -fsSL "${B}1717465962264-517140fe69b1?q=85&w=938&h=704&fit=crop&fm=webp"  -o "$Z/foto-fisch-ofen.webp"
          curl -fsSL "${B}1760546070850-a8a3531bb857?q=85&w=938&h=704&fit=crop&fm=webp"  -o "$Z/foto-terrasse.webp"
          curl -fsSL "${B}1756364084889-9a8d9ece6112?q=85&w=938&h=704&fit=crop&fm=webp"  -o "$Z/foto-rohware.webp"
          curl -fsSL "${B}1580929753530-ef52238116c5?q=82&w=1568&h=624&fit=crop&fm=webp" -o "$Z/foto-tafel-kerzen.webp"
          curl -fsSL "${B}1726873800099-53f5496281e0?q=82&w=1568&h=624&fit=crop&fm=webp" -o "$Z/foto-fassade-abend.webp"
          curl -fsSL "${B}1552960226-639240203497?q=85&w=938&h=704&fit=crop&fm=webp"   -o "$Z/foto-interieur.webp"
          for f in "$Z"/foto-*.webp; do
            g=$(wc -c < "$f")
            [ "$g" -gt 10000 ] || { echo "::error::Foto zu klein/fehlerhaft: $f ($g B)"; exit 1; }
            echo "geladen: $f ($g Bytes)"
          done

      - name: Pflichtdateien vorhanden?
        run: |
          set -e
          for f in public/index.html public/demo/index.html \
                   public/daten/produkte.js public/assets/css/style.css \
                   public/assets/js/seite.js; do
            [ -f "$f" ] || { echo "::error::Datei fehlt: $f"; exit 1; }
          done
          echo "Website vollstaendig: $(find public -type f | wc -l) Dateien."
          echo "Ziel: ${{ vars.FTP_USER || 'admin@spoti.ch' }}@${{ vars.FTP_HOST || 's039.cyon.net' }} -> ${{ vars.FTP_ZIEL || '/salesforce/' }}"

      - name: Preisfreigabe pruefen
        run: |
          if grep -qE '"preise_freigegeben"[[:space:]]*:[[:space:]]*false[[:space:]]*,' public/daten/produkte.js; then
            echo "::warning title=Preise ausgeblendet::preise_freigegeben steht auf false. Die Seite zeigt ueberall 'Preis auf Anfrage' und einen Hinweisbalken."
          else
            echo "Preise sind freigegeben."
          fi

      - name: FTP Deploy
        id: upload1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.FTP_HOST || 's039.cyon.net' }}
          username: ${{ vars.FTP_USER || 'admin@spoti.ch' }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_ZIEL || '/salesforce/' }}
          local-dir: ./public/
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
            **/node_modules/**

      - name: FTP Deploy (Wiederholung bei Timeout)
        if: steps.upload1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.FTP_HOST || 's039.cyon.net' }}
          username: ${{ vars.FTP_USER || 'admin@spoti.ch' }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_ZIEL || '/salesforce/' }}
          local-dir: ./public/
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
            **/node_modules/**

      - name: Fertig
        run: echo "Hochgeladen. Seite pruefen unter https://www.spoti.ch"
