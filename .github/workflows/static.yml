# Vorschau auf GitHub Pages - laeuft NUR von Hand.
#
# Warum nicht automatisch: spoti.ch ist die eine echte Adresse. Liefe diese
# Vorschau bei jedem Push mit, gaebe es eine zweite oeffentliche Kopie der
# Seite unter github.io, die mit spoti.ch um den Google-Platz konkurriert.
#
# Zum Anschauen einer Aenderung, bevor sie auf spoti.ch geht:
# Actions -> "Vorschau auf GitHub Pages" -> Run workflow.
#
# Veroeffentlicht ausschliesslich den Ordner public/ - niemals das Repo.

name: Vorschau auf GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
