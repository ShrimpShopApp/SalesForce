name: spoti.ch veroeffentlichen

# DAS ist das Deployment von spoti.ch.
# Die Domain www.spoti.ch zeigt auf GitHub Pages (Settings -> Pages,
# Custom domain), nicht auf cyon. Jede Aenderung auf main geht hier raus.
#
# Veroeffentlicht wird ausschliesslich der Ordner public/ - niemals das
# Repo-Wurzelverzeichnis. Genau daran ist es vorher gescheitert: mit
# path '.' lag kein index.html an der Wurzel, also lieferte Pages 404.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Auf spoti.ch veroeffentlichen
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Bilder aus Textdateien erzeugen
        run: |
          for b in public/assets/img/*.b64; do
            ziel="${b%.b64}"
            base64 -d "$b" > "$ziel"
            echo "erzeugt: $ziel ($(wc -c < "$ziel") Bytes)"
          done

      - name: Fotos laden (Unsplash-Lizenz, siehe BILDNACHWEIS.md)
        run: |
          set -e
          B="https://images.unsplash.com/photo-"
          Z="public/assets/img"
          curl -fsSL "${B}1773806902883-8a65768c75f6?q=85&w=1568&h=704&fit=crop&fm=webp" -o "$Z/foto-hero-see.webp"
          curl -fsSL "${B}1684253193395-bb87ad32d4be?q=85&w=938&h=704&fit=crop&fm=webp"  -o "$Z/foto-crevetten-grill.webp"
          curl -fsSL "${B}1717465962264-517140fe69b1?q=85&w=938&h=704&fit=crop&fm=webp"  -o "$Z/foto-fisch-ofen.webp"
          curl -fsSL "${B}1760546070850-a8a3531bb857?q=85&w=938&h=704&fit=crop&fm=webp"  -o "$Z/foto-terrasse.webp"
          curl -fsSL "${B}1756364084889-9a8d9ece6112?q=85&w=938&h=704&fit=crop&fm=webp"  -o "$Z/foto-rohware.webp"
          for f in "$Z"/foto-*.webp; do
            g=$(wc -c < "$f")
            [ "$g" -gt 10000 ] || { echo "::error::Foto zu klein/fehlerhaft: $f ($g B)"; exit 1; }
            echo "geladen: $f ($g Bytes)"
          done

      - name: Pflichtdateien vorhanden?
        run: |
          set -e
          for f in public/index.html public/demo/index.html \
                   public/daten/produkte.js public/assets/css/style.css \
                   public/assets/js/seite.js public/CNAME; do
            [ -f "$f" ] || { echo "::error::Datei fehlt: $f"; exit 1; }
          done
          echo "Website vollstaendig: $(find public -type f | wc -l) Dateien."
          echo "Custom domain: $(cat public/CNAME)"

      - name: Preisfreigabe pruefen
        run: |
          if grep -qE '"preise_freigegeben"[[:space:]]*:[[:space:]]*false[[:space:]]*,' public/daten/produkte.js; then
            echo "::warning title=Preise ausgeblendet::preise_freigegeben steht auf false. Die Seite zeigt ueberall 'Preis auf Anfrage' und einen Hinweisbalken."
          else
            echo "Preise sind freigegeben."
          fi

      - name: Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Nur public/ hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
