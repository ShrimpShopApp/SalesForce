  <text x="42" y="126" font-family="Georgia,serif" font-size="30" fill="#e6b86b">Seit 1974.</text>
  <rect x="42" y="146" width="108" height="26" rx="3" fill="#c8874a"/>
  <rect x="160" y="146" width="108" height="26" rx="3" fill="none" stroke="#f7f3ec" stroke-opacity=".5" stroke-width="1.5"/>

  <!-- Inhalt: drei Karten -->
  <g>
    <rect x="42" y="220" width="146" height="80" rx="3" fill="#fff" stroke="#e0d8c9"/>
    <rect x="207" y="220" width="146" height="80" rx="3" fill="#fff" stroke="#e0d8c9"/>
    <rect x="372" y="220" width="146" height="80" rx="3" fill="#fff" stroke="#e0d8c9"/>

    <g fill="#c8874a">
      <rect x="58" y="236" width="42" height="6" rx="3"/>
      <rect x="223" y="236" width="42" height="6" rx="3"/>
      <rect x="388" y="236" width="42" height="6" rx="3"/>
    </g>
    <g fill="#22333b" opacity=".78">
