<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330" role="img" aria-label="Vorschau der Beispiel-Website Restaurant Seeblick">
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132a35"/>
      <stop offset="1" stop-color="#2c4a3d"/>
    </linearGradient>
    <linearGradient id="see" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f6b78" stop-opacity=".55"/>
      <stop offset="1" stop-color="#3f6b78" stop-opacity="0"/>
