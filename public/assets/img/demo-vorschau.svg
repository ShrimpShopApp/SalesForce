  </defs>

  <rect width="560" height="330" fill="#f7f3ec"/>

  <!-- Hero -->
  <rect width="560" height="196" fill="url(#hg)"/>
  <path d="M0 128c60-22 108 12 168-4s112-30 176-12 132 4 216-16v100H0z" fill="url(#see)"/>
  <circle cx="470" cy="46" r="20" fill="#d9a441" opacity=".5"/>

  <!-- Navigation -->
  <rect x="0" y="0" width="560" height="34" fill="#0d1b23" opacity=".55"/>
  <text x="26" y="22" font-family="Georgia,serif" font-size="13" fill="#f7f3ec" letter-spacing="1.6">SEEBLICK</text>
  <g fill="#f7f3ec" opacity=".62">
    <rect x="336" y="14" width="38" height="5" rx="2.5"/>
    <rect x="386" y="14" width="46" height="5" rx="2.5"/>
